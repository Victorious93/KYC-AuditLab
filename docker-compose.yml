version: "3.9"

services:
  db:
    image: postgres:16-alpine
    environment:
      # Credentials come from .env (see .env.example); compose refuses to start without them.
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-identityshield}
    # Postgres is NOT published on the host: the backend reaches it on the
    # internal compose network as db:5432. For local debugging only, uncomment
    # to expose it on loopback (never 0.0.0.0):
    # ports:
    #   - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    # Serves both the orchestrator API and the local KYC simulator
    # (mounted at /simulator) in one process - there is intentionally no
    # second "target" container, since the simulator IS the only
    # authorized target for this deployment.
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-identityshield}
      IDENTITYSHIELD_ALLOWED_TARGETS: backend,localhost,127.0.0.1
      IDENTITYSHIELD_LOCAL_ONLY: "true"
      IDENTITYSHIELD_EVIDENCE_DIR: /evidence
      # Required: API keys (identity:roles:sha256hex). Unset => protected routes fail closed (503).
      IDENTITYSHIELD_API_KEYS: ${IDENTITYSHIELD_API_KEYS:-}
    volumes:
      - evidence:/evidence
    ports:
      - "8000:8000"

  dashboard:
    build: ./dashboard
    depends_on:
      - backend
    environment:
      VITE_API_BASE_URL: http://localhost:8000
      VITE_API_KEY: ${VITE_API_KEY:-}
    ports:
      - "5173:5173"

volumes:
  pgdata:
  evidence:
