name: CI / security

# Billing notes (GitHub rounds every job up to a whole minute):
# - 3 jobs instead of 6; heavy jobs are skipped for docs-only changes.
# - push runs only for main; PR branches are covered by the pull_request run,
#   so a PR commit is never built twice.
# - Superseded PR runs are cancelled; main runs are never cancelled.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: read

jobs:
  security-scans:
    # Always runs, on every change (including docs-only: secrets can live in .md).
    # Also decides whether the heavy jobs below need to run.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      code: ${{ steps.changes.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect docs-only change
        id: changes
        # Fail-safe: anything unexpected (unknown event, missing base, diff error)
        # means "code changed" so the heavy jobs run.
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          code=true
          base=""
          if [ "$EVENT" = "pull_request" ]; then base="$PR_BASE"; fi
          if [ "$EVENT" = "push" ]; then base="$PUSH_BEFORE"; fi
          if [ -n "$base" ] && [ "$base" != "0000000000000000000000000000000000000000" ] \
             && files=$(git diff --name-only "$base" HEAD) && [ -n "$files" ]; then
            echo "Changed files:"; echo "$files"
            # Docs-only = every changed path is a Markdown file or under docs/.
            if ! echo "$files" | grep -Ev '(\.md$|^docs/)' >/dev/null; then
              code=false
            fi
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "Heavy jobs needed: $code"

      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Account artifact storage quota is exhausted; report goes to the log instead.
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"

      # Each scan runs even if an earlier one failed, so one finding never hides another.
      - uses: actions/setup-python@v5
        if: ${{ !cancelled() }}
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-postgres.txt
      - name: pip-audit
        if: ${{ !cancelled() }}
        run: |
          pip install pip-audit
          pip-audit -r backend/requirements.txt -r backend/requirements-postgres.txt

      - uses: actions/setup-node@v4
        if: ${{ !cancelled() }}
        with:
          node-version: "20"
      - name: npm audit (blocking on high/critical)
        if: ${{ !cancelled() }}
        working-directory: dashboard
        run: npm audit --audit-level=high

  backend:
    needs: security-scans
    # Runs even if a scan failed (scan failures still fail the run); skipped for docs-only.
    if: ${{ !cancelled() && needs.security-scans.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: pytest (default / vulnerable simulator mode)
        run: python -m pytest -q
      - name: pytest (hardened simulator mode)
        if: ${{ !cancelled() }}
        env:
          IDENTITYSHIELD_SIM_VULNERABLE: "0"
        run: python -m pytest -q

  dashboard-android:
    needs: security-scans
    if: ${{ !cancelled() && needs.security-scans.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # --- Dashboard: builds and fails if the bundle contains anything key-like.
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
        working-directory: dashboard
      - name: Build (server-side key env set as a canary; it must not reach the bundle)
        working-directory: dashboard
        env:
          IDENTITYSHIELD_DEV_API_KEYS: ci:admin+operator:ci-canary-dev-key-0f3a9
        run: npm run build
      - name: Scan bundle for key-like content
        working-directory: dashboard
        env:
          BUNDLE_CANARIES: ci-canary-dev-key-0f3a9
        run: npm run check:bundle
      - name: Build refuses a secret-looking VITE_ variable
        working-directory: dashboard
        run: |
          if VITE_API_KEY=ci-canary-vite-key npx vite build --outDir /tmp/should-not-build; then
            echo "vite build accepted VITE_API_KEY"; exit 1
          fi
      - name: Scanner self-test (must detect a planted key)
        working-directory: dashboard
        run: |
          mkdir -p /tmp/planted
          echo 'fetch(u,{headers:{"X-API-Key":"planted-planted-planted"}})' > /tmp/planted/a.js
          if node scripts/check-bundle-secrets.mjs /tmp/planted; then
            echo "scanner missed a planted key"; exit 1
          fi

      # --- Android (Layer 4 companion): compile only (no device). No artifact upload
      # (storage quota). Runs even if a dashboard step failed.
      - uses: actions/setup-java@v4
        if: ${{ !cancelled() }}
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Android assembleDebug
        if: ${{ !cancelled() }}
        working-directory: android-companion
        run: ./gradlew --no-daemon assembleDebug
